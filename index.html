<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIVE Vertical</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #0f0f0f;
    overflow: hidden;
    font-family: system-ui, sans-serif;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #stage {
    position: relative;
    height: 100vh;
    max-height: 100vh;
    aspect-ratio: 9 / 16;
    background: #000;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 0 60px rgba(0, 0, 0, 0.8);
    cursor: pointer;
  }

  #stage video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    object-fit: cover;
    background: #000;
  }

  #emojiLayer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 10;
    --emoji-travel: 100vh;
  }

  .emoji {
    position: absolute;
    bottom: -40px;
    will-change: transform, opacity;
    animation-name: floatUp;
    animation-timing-function: linear;
    animation-fill-mode: forwards;
  }

  @keyframes floatUp {
    0%   { transform: translateY(0) scale(0.6) rotate(-8deg); opacity: 0; }
    5%   { opacity: 1; }
    90%  { opacity: 1; }
    100% { transform: translateY(calc(-1 * var(--emoji-travel))) scale(1.15) rotate(10deg); opacity: 0; }
  }

  #hint {
    position: fixed;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255, 255, 255, 0.35);
    font-size: 13px;
    background: rgba(0, 0, 0, 0.45);
    padding: 6px 14px;
    border-radius: 999px;
    z-index: 50;
    pointer-events: none;
    transition: opacity 1s;
  }

  #vstatus {
    position: fixed;
    top: 10px;
    left: 10px;
    color: #fff;
    font-size: 11px;
    background: rgba(0, 0, 0, 0.55);
    padding: 4px 10px;
    border-radius: 999px;
    z-index: 60;
    pointer-events: none;
    max-width: 50%;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #vstatus.live { background: rgba(34, 197, 94, 0.75); }
  #vstatus.error { background: rgba(220, 38, 38, 0.85); }
</style>
</head>
<body>

<div id="stage">
  <video id="video" muted autoplay playsinline></video>
  <div id="emojiLayer"></div>
</div>

<div id="hint">Toca para activar el sonido y pantalla completa</div>
<div id="vstatus">Conectando...</div>

<script src="/hls.js"></script>
<script src="/reactions.js"></script>
<script>
  // ===== CONFIG =====
  const CONFIG = %%CONFIG_OBJ%%;

  const STREAM_URL = CONFIG.streamUrl;
  const VIDEO_DELAY = CONFIG.delay;
  const EMOJIS = CONFIG.emojis;
  const MAX_EMOJIS_DEFAULT = CONFIG.maxEmojis;

  const params = new URLSearchParams(window.location.search);
  const layer = document.getElementById('emojiLayer');

  // ===== VIDEO (HLS) =====
  const video = document.getElementById('video');
  const src = params.get('src') || STREAM_URL;
  const delayOverride = parseInt(params.get('delay') ?? '', 10);

  async function initVideo() {
    const vstatus = document.getElementById('vstatus');
    const setStatus = (t, cls) => {
      vstatus.textContent = t;
      vstatus.className = cls || '';
    };

    let delay = Number.isFinite(delayOverride) ? delayOverride : VIDEO_DELAY;
    try {
      const res = await fetch('/config');
      const cfg = await res.json();
      if (!Number.isFinite(delayOverride) && cfg && typeof cfg.delay === 'number') delay = cfg.delay;
    } catch {}

    if (Hls.isSupported()) {
      const hls = new Hls({
        ...(delay > 0 ? { liveSyncDuration: delay } : {}),
        maxLiveSyncPlaybackRate: 1.5,
        backBufferLength: 30,
      });

      hls.on(Hls.Events.MANIFEST_PARSED, () => setStatus('Cargando video...'));
      hls.on(Hls.Events.LEVEL_LOADED, () => setStatus('En directo'));
      let lastReload = 0;
      hls.on(Hls.Events.ERROR, (_e, data) => {
        const d = data.details || data.type;
        setStatus('Error hls: ' + d, 'error');

        const sessionIssue =
          d === 'audioTrackLoadError' ||
          d === 'levelLoadError' ||
          d === 'manifestLoadError';

        if (sessionIssue) {
          const now = Date.now();
          if (now - lastReload > 10000) {
            lastReload = now;
            setStatus('Reconectando...', '');
            setTimeout(() => {
              try { hls.loadSource(src); } catch {}
            }, 1200);
          }
          return;
        }

        if (data.fatal) {
          if (data.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
          else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
        }
      });
      video.addEventListener('playing', () => setStatus('En directo', 'live'));

      hls.loadSource(src);
      hls.attachMedia(video);
      window.__hls = hls;
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = src;
    }
  }

  initVideo();

  // ===== VIGILANTE ANTI-CONGELAMIENTO =====
  let lastTime = video.currentTime;
  let stuckFor = 0;
  setInterval(() => {
    if (video.paused || video.readyState < 2) return;
    const advancing = Math.abs(video.currentTime - lastTime) > 0.05;
    if (advancing) {
      stuckFor = 0;
      lastTime = video.currentTime;
      return;
    }
    stuckFor += 2;
    if (stuckFor >= 6) {
      stuckFor = 0;
      try {
        const b = video.buffered;
        if (b.length) {
          video.currentTime = b.end(b.length - 1) - 0.2;
        }
        window.__hls?.recoverMediaError();
        video.play().catch(() => {});
        const s = document.getElementById('vstatus');
        if (s) { s.textContent = 'Recuperado'; s.className = ''; }
      } catch {}
    }
  }, 2000);

  // ===== REACCIONES (via bus de eventos) =====
  const MAX_EMOJIS = Math.max(1, parseInt(params.get('max') ?? '', 10) || MAX_EMOJIS_DEFAULT);
  let activeEmojis = 0;

  function spawnEmoji() {
    if (activeEmojis >= MAX_EMOJIS) return;

    const el = document.createElement('span');
    el.className = 'emoji';
    el.textContent = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
    el.style.left = `${Math.random() * 90 + 2}%`;
    el.style.fontSize = `${Math.random() * 30 + 24}px`;
    el.style.animation = `floatUp ${Math.random() * 3 + 4}s linear ${Math.random() * 0.8}s forwards`;

    layer.appendChild(el);
    activeEmojis++;

    el.addEventListener('animationend', () => {
      el.remove();
      activeEmojis = Math.max(0, activeEmojis - 1);
    });
  }

  // Reaccion 'emoji': lanza `count` emojis al recibir el evento
  Reactions.register('emoji', (data) => {
    const count = Math.min(3, Math.max(1, parseInt(data.count, 10) || 1));
    for (let i = 0; i < count; i++) spawnEmoji();
  });

  // Fuente aleatoria: emite eventos 'reaction' al bus (por ahora los aleatorios)
  function randomReactionSource() {
    if (document.hidden) {
      layer.replaceChildren();
      activeEmojis = 0;
      setTimeout(randomReactionSource, 1000);
      return;
    }
    EventBus.emit('reaction', { type: 'emoji' });
    setTimeout(randomReactionSource, Math.random() * 400 + 200);
  }

  randomReactionSource();

  // Expuesto para debug / futuros orígenes (p. ej. chat de TikTok):
  //   EventBus.emit('reaction', { type: 'emoji', count: 3 });
  window.__bus = EventBus;
  window.__reactions = Reactions;

  function updateEmojiTravel() {
    layer.style.setProperty('--emoji-travel', layer.clientHeight + 'px');
  }
  updateEmojiTravel();
  window.addEventListener('resize', updateEmojiTravel);

  // ===== FULLSCREEN + SONIDO =====
  const stage = document.getElementById('stage');
  const hint = document.getElementById('hint');
  stage.addEventListener('click', () => {
    hint.style.opacity = '0';
    if (video.muted) video.muted = false;
    if (!document.fullscreenElement) {
      stage.requestFullscreen?.();
    } else {
      document.exitFullscreen?.();
    }
  });
</script>
</body>
</html>
