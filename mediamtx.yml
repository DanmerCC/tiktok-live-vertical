logLevel: info

rtmp: yes
rtmpAddress: :1935

hls: yes
hlsAddress: :8888

paths:
  live/stream:
    source: publisher
    runOnOnline: ffmpeg -hide_banner -loglevel error -rtsp_transport tcp -i rtsp://127.0.0.1:8554/live/stream -c:v libx264 -profile:v baseline -level:v 3.1 -preset veryfast -tune zerolatency -g 30 -sc_threshold 0 -pix_fmt yuv420p -c:a aac -b:a 128k -ac 2 -f flv rtmp://127.0.0.1:1935/live/clean
  live/clean:
    source: publisher
  all: